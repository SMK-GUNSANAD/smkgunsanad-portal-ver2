<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Jual Beli Jadual Waktu - SMK Gunsanad</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --hitam:#1a1a1a; --kuning:#ffc107; --hijau:#28a745; --putih:#ffffff;
    }
    body {
      font-family:'Oswald',sans-serif; margin:0; background:var(--putih); color:var(--hitam);
    }
    header {
      padding:18px; border-bottom:4px solid var(--hijau);
      background:var(--putih); display:flex; align-items:center; gap:12px;
    }
    header img { width:64px; height:64px; border-radius:8px; object-fit:cover; }
    header h1 { margin:0; color:var(--kuning); }
    main { max-width:920px; margin:20px auto; padding:16px; }
    form {
      background:var(--putih); border-radius:10px; padding:18px;
      box-shadow:0 8px 20px rgba(0,0,0,0.06);
    }
    label { display:block; margin-top:10px; font-weight:700; }
    input, textarea, select {
      width:100%; padding:10px; margin-top:6px;
      border:2px solid rgba(0,0,0,0.08); border-radius:8px;
    }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .actions { margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; }
    .btn-primary {
      background:var(--kuning); border:none; padding:12px 16px;
      border-radius:8px; font-weight:700; cursor:pointer;
    }
    table {
      width:100%; border-collapse:collapse; margin-top:20px;
    }
    th, td {
      border:1px solid rgba(0,0,0,0.08); padding:10px; text-align:center;
    }
    th { background:var(--hijau); color:var(--putih); }
    footer {
      background:var(--kuning); color:var(--hitam); text-align:center;
      padding:12px; margin-top:24px; font-weight:700;
    }
    @media(max-width:700px){
      .row{grid-template-columns:1fr}
      header{flex-direction:column; align-items:flex-start}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo-smkgunsanad.png" alt="Logo">
      <div>
        <h1 id="title-text">DASHBOARD SMK GUNSANAD</h1>
        <p id="subtitle-text">SMK GUNSANAD BERABIS CEMERLANG</p>
      </div>
    </div>

    <div class="lang-switch" aria-hidden="false">
      <button class="lang-btn" id="btn-bm">BM</button>
      <button class="lang-btn" id="btn-en">EN</button>
    </div>
  </header>

  <main>
       <section style="margin-top:10px; text-align:center;">
      <h2 id="welcome-title">Selamat Datang</h2>
      <p id="welcome-desc">Portal rasmi untuk warga SMK Gunsanad. Gunakan menu di bawah untuk mengakses sistem sekolah.</p>
    </section>

     <main>
       <section style="margin-top:30px; text-align:left;">
     
    </section>
    
    <div class="grid" id="buttonGrid">
      
    </div>
    
    
    <div class="grid" id="buttonGrid">
      <a href="#" class="card btn-hem" id="unit-hem">UNIT HEM</a>
      <a href="jual-beli.html" target="_blank" class="card btn-mmi" id="mmi">MMI SEKOLAH (JUAL BELI)</a>
      <a href="#" class="card btn-erph" id="erph">ERPH</a>
      <a href="#" class="card btn-kawalan" id="kawalan">KAWALAN KELAS</a>
    </div>

  
  </main>
    
<footer>
  <div class="footer-content">
    <div>SMK GUNSANAD BERABIS CEMERLANG</div>
    <small>Versi 2.0 &nbsp;|&nbsp; Dikemaskini Oktober 2025</small>
  </div>
</footer>

  <script>
    const texts = {
      bm: {
        title: "DASHBOARD SMK GUNSANAD",
        subtitle: "SMK GUNSANAD BERABIS CEMERLANG",
        unitHem: "UNIT HEM",
        mmi: "MMI SEKOLAH (JUAL BELI)",
        erph: "ERPH",
        kawalan: "KAWALAN KELAS",
        welcomeTitle: "Selamat Datang",
        welcomeDesc: "Portal rasmi untuk warga SMK Gunsanad. Gunakan menu di bawah untuk mengakses sistem sekolah."
      },
      en: {
        title: "SMK GUNSANAD DASHBOARD",
        subtitle: "SMK GUNSANAD BERABIS CEMERLANG",
        unitHem: "Student Affairs Unit",
        mmi: "MMI SCHOOL (TRADE PERIODS)",
        erph: "ERPH",
        kawalan: "CLASS CONTROL",
        welcomeTitle: "Welcome",
        welcomeDesc: "Official portal for SMK Gunsanad staff. Use the menu above to access school systems."
      }
    };

    const setLang = (lang) => {
      localStorage.setItem('siteLang', lang);
      const t = texts[lang];
      document.getElementById('title-text').textContent = t.title;
      document.getElementById('subtitle-text').textContent = t.subtitle;
      document.getElementById('unit-hem').textContent = t.unitHem;
      document.getElementById('mmi').textContent = t.mmi;
      document.getElementById('erph').textContent = t.erph;
      document.getElementById('kawalan').textContent = t.kawalan;
      document.getElementById('welcome-title').textContent = t.welcomeTitle;
      document.getElementById('welcome-desc').textContent = t.welcomeDesc;
    };

    document.getElementById('btn-bm').addEventListener('click', () => setLang('bm'));
    document.getElementById('btn-en').addEventListener('click', () => setLang('en'));

    const saved = localStorage.getItem('siteLang') || 'bm';
    setLang(saved);
  </script>
  
</body>
</html>
