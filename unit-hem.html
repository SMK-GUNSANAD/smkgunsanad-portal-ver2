<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PENGURUSAN AKADEMIK - SMK Gunsanad</title>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --hitam:#1a1a1a;
      --kuning:#ffc107;
      --hijau:#28a745;
      --putih:#ffffff;
    }

    body {
      font-family:'Oswald',sans-serif;
      margin:0;
      background:var(--putih);
      color:var(--hitam);
    }

    header {
      padding:18px;
      border-bottom:4px solid var(--hijau);
      background:var(--putih);
      display:flex;
      align-items:center;
      gap:12px;
    }

    header img {
      width:64px;
      height:64px;
      border-radius:8px;
      object-fit:cover;
    }

    header h1 {
      margin:0;
      color:var(--kuning);
    }

    main {
      max-width:1100px;
      margin:0 auto;
      padding:28px;
      padding-bottom:150px;
    }
    
.btn-back{
  background: var(--hijau);
  color: var(--putih);
  max-width:100px;
  height: 60px;   
  font-size: 14px;     /* tulisan */
  margin:0 auto;
}
    
  /* GRID DIJADIKAN 1 BARIS KE BAWAH */
  .grid{
  display:grid;
  grid-template-columns: 1fr;
  gap:20px;
  max-width:350px;   /* semua button ikut lebar ini */
  margin:0 auto;     /* tengah */
  
}

/* BUTTON */
.card{
  width:100%;        /* ❗ SEMUA BUTTON SAMA LEBAR */
  height:20px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
  background:#fbfbfb;
  text-align:center;
  font-weight:700;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--hitam);

  display:flex;
  align-items:center;
  justify-content:center;
}

    /* 🔽 BUTTON TENGAH & KEMAS */
    .grid a{
      max-width:600px;
      margin:0 auto;
    }

    .card{
      padding:22px;
      border-radius:12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      background:#fbfbfb;
      text-align:center;
      font-weight:700;
      text-transform:uppercase;
      text-decoration:none;
      color:var(--hitam);
    }

    .btn-perdana,
    .btn-t6,
    .btn-ppki,
    .btn-ubk,
    .btn-hem,
    .btn-kokum{
      background:var(--kuning);
    }

    footer {
      background:var(--putih);
      color:var(--hitam);
      text-align:center;
      padding:12px;
      font-weight:700;
    }

    @media(max-width:700px){
      header{
        flex-direction:column;
        align-items:flex-start;
      }
      
    }
  </style>
</head>

<body>

<header>
  <img src="logo-smkgunsanad.png" alt="logo">
  <div>
    <h1>PENGURUSAN AKADEMIK</h1>
    <div style="font-weight:700;">SMK GUNSANAD BERABIS CEMERLANG</div>
  </div>
</header>

<main>

  <section style="margin-top:10px; text-align:center;">
    <h2 id="welcome-title"></h2>
    <p id="welcome-desc"></p>
  </section>

  <!-- BUTTON 1 BARIS KE BAWAH -->
  <div class="grid">
    <a href="#" target="_blank" class="card btn-perdana">PERDANA 1 - 5</a>
    <a href="#" target="_blank" class="card btn-t6">TINGKATAN 6</a>
    <a href="#" target="_blank" class="card btn-ppki">PENDIDIKAN KHAS</a>
    <a href="#" target="_blank" class="card btn-ubk">UNIT BIMBINGAN DAN KAUNSELING</a>
    <a href="#" target="_blank" class="card btn-hem">UNIT HAL EHWAL MURID</a>
    <a href="#" target="_blank" class="card btn-kokum">UNIT KOKURIKULUM</a>
     
  </div>
  
<a href="index.html" class="card btn-back"> 
    ⬅ KEMBALI
 
</a>

</main>

</body>
</html>
